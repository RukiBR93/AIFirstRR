# TODO: reemplazar por los valores reales de tu proyecto en SonarQube Cloud
# (Project -> Information). Sin esto el scanner falla.
sonar.projectKey=RukiBR93_AIFirstRR
sonar.organization=rukibr93

sonar.sourceEncoding=UTF-8

# Único código com testes/coverage hoje é o monorepo eventpets.
sonar.sources=eventpets/apps/api/src,eventpets/apps/web/app,eventpets/apps/web/lib,mcp

# Testes ficam colocalizados com o código-fonte (ex.: page.tsx e page.test.tsx
# na mesma pasta). Por isso os mesmos diretórios entram em sonar.tests, e os
# arquivos de teste são excluídos de sonar.sources (sonar.exclusions) e
# marcados como teste via sonar.test.inclusions — sem isso, cada *.spec.ts/
# *.test.tsx conta como código de produção sem cobertura própria, inflando
# artificialmente as "uncovered lines".
sonar.tests=eventpets/apps/api/src,eventpets/apps/web/app,eventpets/apps/web/lib
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# Reportes LCOV gerados por `npm run test:cov` em cada workspace
# (ver eventpets/apps/api/jest.config.js e eventpets/apps/web/vitest.config.ts).
sonar.javascript.lcov.reportPaths=eventpets/apps/api/coverage/lcov.info,eventpets/apps/web/coverage/lcov.info
